scrape_configs:
  - job_name: automotive-marketplace-api
    scheme: http
    metrics_path: /api/internal/metrics
    static_configs:
      - targets:
          - api-a.internal:4000
          - api-b.internal:4000
        labels:
          service: marketplace-api
          environment: staging
    scrape_interval: 30s
    scrape_timeout: 5s

rule_files:
  - /etc/prometheus/rules/marketplace.rules.yml
