name: marketplace-reference

x-backend: &backend
  image: ${BACKEND_IMAGE:-marketplace-backend:0.1.0-rc.1}
  env_file: ${DEPLOY_ENV_FILE:-.env.production.local}
  environment: &backend-environment
    NODE_ENV: ${REFERENCE_NODE_ENV:-test}
    CONFIG_FROM_ENV: 'true'
    API_PORT: 4000
    WEB_URL: https://localhost:8443
    DATABASE_HOST: postgres
    DATABASE_PORT: 5432
    REDIS_HOST: redis
    REDIS_PORT: 6379
    S3_ENDPOINT: http://minio:9000
    S3_FORCE_PATH_STYLE: 'true'
    AUTH_COOKIE_SECURE: 'true'
    METRICS_ENABLED: 'true'
  read_only: true
  tmpfs:
    - /tmp:size=256m,mode=1777
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  stop_grace_period: 30s
  restart: unless-stopped
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
    minio-init: { condition: service_completed_successfully }

services:
  proxy:
    image: caddy:2.10.2-alpine
    ports:
      - 127.0.0.1:8443:443
    volumes:
      - ./infra/Caddyfile.reference:/etc/caddy/Caddyfile:ro
      - ./infra/reference-map-style.json:/srv/reference-map/style.json:ro
      - caddy-data:/data
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    depends_on:
      api-a: { condition: service_healthy }
      api-b: { condition: service_healthy }
      web: { condition: service_healthy }

  web:
    image: ${WEB_IMAGE:-marketplace-web:0.1.0-rc.1}
    read_only: true
    tmpfs: ['/tmp:size=64m,mode=1777']
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped

  api-a:
    <<: *backend
    ports: ['127.0.0.1:${REFERENCE_API_A_PORT:-64001}:4000']
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:4000/api/v1/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 4s
      retries: 20
      start_period: 15s

  api-b:
    <<: *backend
    ports: ['127.0.0.1:${REFERENCE_API_B_PORT:-64002}:4000']
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:4000/api/v1/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 4s
      retries: 20
      start_period: 15s

  media-worker:
    <<: *backend
    command: [node, apps/api/dist/main-media-worker.js]
    healthcheck: { disable: true }
    tmpfs:
      - /tmp:size=1g,mode=1777

  engagement-worker:
    <<: *backend
    command: [node, apps/api/dist/main-engagement-worker.js]
    healthcheck: { disable: true }

  delivery-worker:
    <<: *backend
    command: [node, apps/api/dist/main-delivery-worker.js]
    healthcheck: { disable: true }

  migration:
    <<: *backend
    command:
      [
        node,
        node_modules/typeorm/cli.js,
        migration:run,
        -d,
        apps/api/dist/platform/database/data-source.js,
      ]
    restart: 'no'
    healthcheck: { disable: true }
    depends_on:
      postgres: { condition: service_healthy }

  postgres:
    image: postgis/postgis:17-3.5
    env_file: ${DEPLOY_ENV_FILE:-.env.production.local}
    environment:
      POSTGRES_DB: ${DATABASE_NAME:?DATABASE_NAME is required}
      POSTGRES_USER: ${DATABASE_USER:?DATABASE_USER is required}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD is required}
      TZ: UTC
    volumes: [postgres-data:/var/lib/postgresql/data]
    ports: ['127.0.0.1:${REFERENCE_DATABASE_PORT:-65432}:5432']
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    env_file: ${DEPLOY_ENV_FILE:-.env.production.local}
    command:
      [
        sh,
        -c,
        'exec redis-server --appendonly yes --maxmemory-policy noeviction --requirepass "$$REDIS_PASSWORD"',
      ]
    volumes: [redis-data:/data]
    ports: ['127.0.0.1:${REFERENCE_REDIS_PORT:-56380}:6379']
    healthcheck:
      test:
        [
          CMD-SHELL,
          'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG',
        ]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    env_file: ${DEPLOY_ENV_FILE:-.env.production.local}
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?S3_ACCESS_KEY is required}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?S3_SECRET_KEY is required}
      MINIO_API_CORS_ALLOW_ORIGIN: https://localhost:8443
    command: server /data
    volumes: [minio-data:/data]
    ports: ['127.0.0.1:${REFERENCE_S3_PORT:-59002}:9000']
    healthcheck:
      test: [CMD, curl, -f, http://localhost:9000/minio/health/live]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    env_file: ${DEPLOY_ENV_FILE:-.env.production.local}
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: [/bin/sh, -ec]
    command:
      - |
        mc alias set local http://minio:9000 "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY" >/dev/null
        mc mb --ignore-existing "local/$$S3_BUCKET"
        mc anonymous set none "local/$$S3_BUCKET"
    restart: 'no'

volumes:
  postgres-data:
  redis-data:
  minio-data:
  caddy-data:
